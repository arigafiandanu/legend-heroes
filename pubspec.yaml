name: ashen_crest
description: "Legend Heroes — Chapter 1: Ashen Crest. JRPG pixel art HD-2D (Flutter + Flame)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.35.1
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  flame_tiled: ^3.0.11
  jenny: ^1.5.0
  flame_audio: ^2.11.14
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/props/
    - assets/images/enemies/
    - assets/data/
    - assets/maps/
    - assets/dialog/en/
    - assets/dialog/id/
    - assets/audio/bgm/
